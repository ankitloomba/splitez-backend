<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SplitEZ Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <!-- Login -->
    <div id="login" class="login-wrap" hidden>
      <div class="login-header">
        <svg class="split-logo" width="56" height="56" viewBox="0 0 56 56">
          <defs><clipPath id="c"><circle cx="28" cy="28" r="28"/></clipPath></defs>
          <g clip-path="url(#c)">
            <rect x="-4" y="-4" width="64" height="64" fill="#818CF8"/>
            <rect x="26" y="-4" width="34" height="64" fill="#4338CA" transform="rotate(-15,28,28)"/>
            <rect x="26.5" y="-4" width="3" height="64" fill="var(--bg,#f5f7fa)" transform="rotate(-15,28,28)"/>
          </g>
        </svg>
        <div class="brand">Split<span>EZ</span></div>
        <p>Admin Dashboard</p>
      </div>
      <form id="login-form" class="login-card">
        <h2 style="margin:0 0 4px;font-size:17px;">Sign in</h2>
        <p class="muted" style="margin:0 0 16px;font-size:13px;">Enter your admin credentials to continue</p>
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
        <div id="login-error" class="error" hidden></div>
      </form>
    </div>

    <!-- App shell -->
    <div id="app" class="shell" hidden>
      <aside class="sidebar">
        <div class="brand" style="display:flex;align-items:center;gap:10px;">
          <svg width="28" height="28" viewBox="0 0 56 56">
            <defs><clipPath id="sc"><circle cx="28" cy="28" r="28"/></clipPath></defs>
            <g clip-path="url(#sc)">
              <rect x="-4" y="-4" width="64" height="64" fill="#818CF8"/>
              <rect x="26" y="-4" width="34" height="64" fill="#4338CA" transform="rotate(-15,28,28)"/>
              <rect x="26.5" y="-4" width="3" height="64" fill="var(--surface,#fff)" transform="rotate(-15,28,28)"/>
            </g>
          </svg>
          Split<span>EZ</span>
        </div>
        <nav id="nav">
          <button data-view="overview" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Overview</button>
          <button data-view="analytics"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Analytics</button>
          <button data-view="users"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</button>
          <div class="nav-group">Content</div>
          <button data-view="banners"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Banners</button>
          <button data-view="elements"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>Dashboard Elements</button>
          <button data-view="ads"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Ad Placements</button>
          <div class="nav-group">Legal &amp; Info</div>
          <button data-view="pages"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Content Pages</button>
        </nav>
        <div class="sidebar-foot">
          <button id="theme-toggle" class="ghost"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>Toggle theme</button>
          <button id="logout" class="ghost"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log out</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <h1 id="view-title">Overview</h1>
          <span class="env-pill">production</span>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-wrap" hidden>
      <div class="modal">
        <header><h2 id="modal-title"></h2><button id="modal-close" class="ghost">✕</button></header>
        <form id="modal-form"></form>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </body>
</html>
