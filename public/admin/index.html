<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SplitEZ Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <!-- Login -->
    <div id="login" class="login-wrap" hidden>
      <div class="login-header">
        <svg class="split-logo" width="56" height="56" viewBox="0 0 56 56">
          <defs><clipPath id="c"><circle cx="28" cy="28" r="28"/></clipPath></defs>
          <g clip-path="url(#c)" transform="rotate(-1.72,28,28)">
            <path d="M28 0 A28 28 0 0 0 28 56Z" fill="#818CF8"/>
            <path d="M28 0 A28 28 0 0 1 28 56Z" fill="#4338CA"/>
            <rect x="26.88" y="-1" width="2.24" height="58" fill="var(--bg,#f5f7fa)"/>
          </g>
        </svg>
        <div class="brand">Split<span>EZ</span></div>
        <p>Admin Dashboard</p>
      </div>
      <form id="login-form" class="login-card">
        <h2 style="margin:0 0 4px;font-size:17px;">Sign in</h2>
        <p class="muted" style="margin:0 0 16px;font-size:13px;">Enter your admin credentials to continue</p>
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
        <div id="login-error" class="error" hidden></div>
      </form>
    </div>

    <!-- App shell -->
    <div id="app" class="shell" hidden>
      <aside class="sidebar">
        <div class="brand" style="display:flex;align-items:center;gap:10px;">
          <svg width="28" height="28" viewBox="0 0 56 56">
            <defs><clipPath id="sc"><circle cx="28" cy="28" r="28"/></clipPath></defs>
            <g clip-path="url(#sc)" transform="rotate(-1.72,28,28)">
              <path d="M28 0 A28 28 0 0 0 28 56Z" fill="#818CF8"/>
              <path d="M28 0 A28 28 0 0 1 28 56Z" fill="#4338CA"/>
              <rect x="26.88" y="-1" width="2.24" height="58" fill="var(--surface,#fff)"/>
            </g>
          </svg>
          Split<span>EZ</span>
        </div>
        <nav id="nav">
          <button data-view="overview" class="active"><span class="nav-icon">📊</span>Overview</button>
          <button data-view="analytics"><span class="nav-icon">📈</span>Analytics</button>
          <button data-view="users"><span class="nav-icon">👥</span>Users</button>
          <div class="nav-group">Content</div>
          <button data-view="banners"><span class="nav-icon">🏷️</span>Banners</button>
          <button data-view="elements"><span class="nav-icon">🧩</span>Dashboard Elements</button>
          <button data-view="ads"><span class="nav-icon">📢</span>Ad Placements</button>
          <div class="nav-group">Legal &amp; Info</div>
          <button data-view="pages"><span class="nav-icon">📄</span>Content Pages</button>
        </nav>
        <div class="sidebar-foot">
          <button id="theme-toggle" class="ghost">🌓 Toggle theme</button>
          <button id="logout" class="ghost">🚪 Log out</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <h1 id="view-title">Overview</h1>
          <span class="env-pill">production</span>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-wrap" hidden>
      <div class="modal">
        <header><h2 id="modal-title"></h2><button id="modal-close" class="ghost">✕</button></header>
        <form id="modal-form"></form>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </body>
</html>
