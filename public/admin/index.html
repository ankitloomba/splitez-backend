<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SplitEZ Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <!-- Login -->
    <div id="login" class="login-wrap" hidden>
      <div class="login-header">
        <svg class="split-logo" width="56" height="56" viewBox="0 0 56 56">
          <clipPath id="c"><circle cx="28" cy="28" r="28"/></clipPath>
          <g clip-path="url(#c)">
            <path d="M0 0 L27 0 L27 56 L0 56Z" fill="#818CF8"/>
            <path d="M29 0 L56 0 L56 56 L29 56Z" fill="#4338CA"/>
          </g>
        </svg>
        <div class="brand">Split<span>EZ</span></div>
        <p>Admin Dashboard</p>
      </div>
      <form id="login-form" class="login-card">
        <h2 style="margin:0 0 4px;font-size:17px;">Sign in</h2>
        <p class="muted" style="margin:0 0 16px;font-size:13px;">Enter your admin credentials to continue</p>
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
        <div id="login-error" class="error" hidden></div>
      </form>
    </div>

    <!-- App shell -->
    <div id="app" class="shell" hidden>
      <aside class="sidebar">
        <div class="brand" style="display:flex;align-items:center;gap:10px;">
          <svg width="28" height="28" viewBox="0 0 56 56">
            <clipPath id="sc"><circle cx="28" cy="28" r="28"/></clipPath>
            <g clip-path="url(#sc)">
              <path d="M0 0 L27 0 L27 56 L0 56Z" fill="#818CF8"/>
              <path d="M29 0 L56 0 L56 56 L29 56Z" fill="#4338CA"/>
            </g>
          </svg>
          Split<span>EZ</span>
        </div>
        <nav id="nav">
          <button data-view="overview" class="active">Overview</button>
          <button data-view="analytics">Analytics</button>
          <button data-view="users">Users</button>
          <div class="nav-group">Content</div>
          <button data-view="banners">Banners</button>
          <button data-view="elements">Dashboard Elements</button>
          <button data-view="ads">Ad Placements</button>
          <div class="nav-group">Legal &amp; Info</div>
          <button data-view="pages">Content Pages</button>
        </nav>
        <div class="sidebar-foot">
          <button id="theme-toggle" class="ghost">Toggle theme</button>
          <button id="logout" class="ghost">Log out</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <h1 id="view-title">Overview</h1>
          <span class="env-pill">production</span>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-wrap" hidden>
      <div class="modal">
        <header><h2 id="modal-title"></h2><button id="modal-close" class="ghost">✕</button></header>
        <form id="modal-form"></form>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </body>
</html>
